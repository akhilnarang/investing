[project]
name = "investing"
version = "0.1.0"
description = "Indian investing data: mutual funds, SIFs, stocks, currencies, IPO prospectuses"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Akhil Narang", email = "me@akhilnarang.dev" }]
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2",
    "pydantic-ai-slim[openai]>=2.28.0",
    "markdown-it-py>=4.0.0",
    "cryptography>=43",
    "xlrd>=2.0.1",
    "openpyxl>=3.1",
]

[project.scripts]
coin-tradebook = "investing.coin_tradebook:main"

[tool.fastapi]
entrypoint = "investing.web.app:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.2"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SLF", "DTZ"]
ignore = ["E501", "DTZ007"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_db: needs the maintainer's full database; skipped on the seeded one"]
